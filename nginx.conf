server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # arquivos estáticos
  location ~* \.(?:css|js|json|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|webp)$ {
    expires 7d;
    add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    try_files $uri =404;
  }

  # gzip leve
  gzip on;
  gzip_types text/plain application/javascript application/json text/css image/svg+xml image/x-icon;
  gzip_min_length 256;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
}