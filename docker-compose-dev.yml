version: "3.8"

services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app:rw
      - /app/node_modules
    ports:
      - "5173:5173"       # Vite HMR
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    command: sh -c "npm ci --silent && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped