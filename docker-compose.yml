version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kuhi-frontend:latest
    ports:
      - "8080:80"         # acesso em http://localhost:8080
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  dev:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app:rw
      - /app/node_modules
    ports:
      - "5173:5173"       # Vite HMR
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    command: sh -c "npm ci --silent && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped